# Optional: Postgres in Docker. Skip the postgres service if you use a local PostgreSQL
# (see README), and run only Mailpit with `npm run mail:up`.
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      # Superuser for the container only; the app never connects as it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # The single role Sentinel uses, created by db/docker-init.sh
      SENTINEL_DB_NAME: sentinel
      SENTINEL_DB_USER: sentinel
      SENTINEL_DB_PASSWORD: sentinel
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/sentinel-db:ro
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/01-sentinel.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox

volumes:
  postgres-data:
