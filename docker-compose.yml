# Optional: Postgres in Docker. Skip the postgres service if you use a local PostgreSQL
# (see README), and run only Mailpit with `npm run mail:up`.
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web inbox

volumes:
  postgres-data:
