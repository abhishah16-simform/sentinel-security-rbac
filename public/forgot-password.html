<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot password · SENTINEL</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-aside" id="auth-aside" aria-hidden="true"></aside>
      <main class="auth-main">
        <div class="auth-card">
          <a class="brand" href="/"><span class="brand-mark"><i data-icon="shield"></i></span>SENTINEL</a>
          <div class="status-icon"><i data-icon="key"></i></div>
          <h1>Reset your password</h1>
          <p class="subtitle">We'll email you a link. On the page it opens, we'll send a code as well.</p>
          <form id="request-form" class="form">
            <label>Email <input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@company.com" /></label>
            <button type="submit">Email me a reset link</button>
          </form>
          <p id="message" class="message" role="status" aria-live="polite" hidden></p>
          <p class="links"><a href="/login.html">Back to log in</a></p>
        </div>
        <p class="auth-legal">Protected by SENTINEL · Tenant data is isolated with row-level security</p>
      </main>
    </div>
    <script src="/icons.js"></script>
    <script src="/auth.js"></script>
    <script src="/forms.js"></script>
    <script src="/session.js"></script>
    <script>
      (function () {
        const form = document.getElementById('request-form');
        const message = document.getElementById('message');
        handleForm(form, message, async function (data) {
          const body = await Sentinel.postJson('/v1/auth/password-reset', { email: data.get('email') });
          form.hidden = true;
          showMessage(message, body.message, 'success');
        });
      })();
    </script>
  </body>
</html>
