<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentinel</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Sentinel</h1>
      <p class="subtitle">Authorization and security compliance service</p>

      <section id="account" aria-live="polite">
        <h2>Account</h2>
        <p id="account-loading">Checking your session…</p>
        <div id="logged-out" hidden>
          <p class="links"><a href="/login.html">Log in</a> · <a href="/signup.html">Sign up</a></p>
        </div>
        <div id="logged-in" hidden>
          <ul class="status">
            <li id="name-row" hidden><span>Name</span><span id="me-name"></span></li>
            <li><span>Email</span><span id="me-email"></span></li>
            <li><span>Email verified</span><span id="me-verified"></span></li>
            <li><span>Active Tenant</span><span id="active-tenant"></span></li>
          </ul>
          <button id="edit-name" type="button" class="secondary">Edit name</button>
          <form id="name-form" class="form" hidden>
            <label>First name <input name="firstName" type="text" autocomplete="given-name" required maxlength="100" /></label>
            <label>Last name <input name="lastName" type="text" autocomplete="family-name" required maxlength="100" /></label>
            <div class="actions">
              <button type="submit">Save name</button>
              <button id="cancel-name" type="button" class="secondary">Cancel</button>
            </div>
          </form>
          <p class="links"><a href="/tenants.html" id="tenant-link">Choose or create a Tenant</a></p>
          <button id="resend" type="button" class="secondary" hidden>Resend verification email</button>
          <div class="actions">
            <button id="logout" type="button">Log out</button>
            <button id="logout-all" type="button" class="secondary">Log out everywhere</button>
          </div>
        </div>
        <p id="message" class="message" role="status" hidden></p>
      </section>

      <section aria-live="polite">
        <h2>System status</h2>
        <ul id="status" class="status">
          <li>Checking…</li>
        </ul>
      </section>
    </main>
    <script src="/forms.js"></script>
    <script src="/session.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
