<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in · SENTINEL</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-aside" id="auth-aside" aria-hidden="true"></aside>
      <main class="auth-main">
        <div class="auth-card">
          <a class="brand" href="/"><span class="brand-mark"><i data-icon="shield"></i></span>SENTINEL</a>
          <h1>Welcome back</h1>
          <p class="subtitle">Log in to your SENTINEL account.</p>
          <form id="login-form" class="form">
            <label>Email <input name="email" type="email" autocomplete="username" required maxlength="254" placeholder="you@company.com" /></label>
            <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="••••••••••••" /></label>
            <button type="submit">Log in</button>
          </form>
          <form id="mfa-form" class="form" hidden>
            <p class="hint">We emailed you a 6-digit code. It expires in 10 minutes.</p>
            <label>Code
              <input name="code" inputmode="numeric" autocomplete="one-time-code" required pattern="\d{6}" maxlength="6" placeholder="123456" />
            </label>
            <button type="submit">Verify and log in</button>
            <button type="button" class="ghost" id="resend-code">Email me a new code</button>
          </form>
          <p id="message" class="message" role="alert" hidden></p>
          <p class="links"><a href="/forgot-password.html">Forgot your password?</a></p>
          <p class="links">New to SENTINEL? <a href="/signup.html">Create an account</a></p>
        </div>
        <p class="auth-legal">Protected by SENTINEL · Tenant data is isolated with row-level security</p>
      </main>
    </div>
    <script src="/icons.js"></script>
    <script src="/auth.js"></script>
    <script src="/forms.js"></script>
    <script src="/session.js"></script>
    <script>
      (function () {
        const message = document.getElementById('message');
        const loginForm = document.getElementById('login-form');
        const mfaForm = document.getElementById('mfa-form');
        let mfaToken = null;

        // Pages a link may ask to land on after login (?next=...). A fixed list, so it can't redirect elsewhere.
        const NEXT_PAGES = { invitations: '/invitations.html' };
        const next = NEXT_PAGES[new URLSearchParams(window.location.search).get('next')] || null;

        // One Tenant: go straight into it, unless it is suspended (switching in is refused), when the
        // Tenant picker says so. Several: let the User pick. None: home offers to create one.
        async function enter() {
          const tenants = (await Sentinel.api('/v1/tenants')).items;
          if (tenants.length === 1 && !tenants[0].suspended) {
            await Sentinel.switchTenant(tenants[0].tenantId);
            window.location.href = next || '/';
          } else {
            window.location.href = next || (tenants.length > 0 ? '/tenants.html' : '/');
          }
        }

        handleForm(loginForm, message, async function (data) {
          const pending = await Sentinel.login(data.get('email'), data.get('password'));
          if (!pending) return enter();
          mfaToken = pending.mfaToken;
          loginForm.hidden = true;
          mfaForm.hidden = false;
          mfaForm.elements.code.focus();
        });

        handleForm(mfaForm, message, async function (data) {
          try {
            await Sentinel.completeMfa(mfaToken, data.get('code'));
          } catch (error) {
            // 401: this login attempt expired, so start again from the password.
            if (error.status === 401) {
              mfaForm.reset();
              mfaForm.hidden = true;
              loginForm.hidden = false;
            }
            throw error;
          }
          await enter();
        });

        document.getElementById('resend-code').addEventListener('click', async function () {
          try {
            const body = await Sentinel.postJson('/v1/auth/login/mfa/resend', { mfaToken: mfaToken });
            showMessage(message, body.message, 'success');
          } catch (error) {
            showMessage(message, error.message, 'error');
          }
        });
      })();
    </script>
  </body>
</html>
