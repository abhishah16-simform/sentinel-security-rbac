<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · SENTINEL</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-aside" id="auth-aside" aria-hidden="true"></aside>
      <main class="auth-main">
        <div class="auth-card">
          <a class="brand" href="/"><span class="brand-mark"><i data-icon="shield"></i></span>SENTINEL</a>
          <h1>Create your account</h1>
          <p class="subtitle">One SENTINEL login for every Tenant you belong to.</p>
          <form id="signup-form" class="form">
            <div class="row">
              <label>First name <input name="firstName" type="text" autocomplete="given-name" required maxlength="100" placeholder="Ada" /></label>
              <label>Last name <input name="lastName" type="text" autocomplete="family-name" required maxlength="100" placeholder="Lovelace" /></label>
            </div>
            <label>Work email <input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@company.com" /></label>
            <label>
              Password
              <input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="At least 12 characters" />
              <span class="hint">Use 12 or more characters. A passphrase works well.</span>
            </label>
            <button type="submit">Create account</button>
          </form>
          <p id="message" class="message" role="status" aria-live="polite" hidden></p>
          <p class="links">Already have an account? <a href="/login.html">Log in</a></p>
        </div>
        <p class="auth-legal">Protected by SENTINEL · Tenant data is isolated with row-level security</p>
      </main>
    </div>
    <script src="/icons.js"></script>
    <script src="/auth.js"></script>
    <script src="/forms.js"></script>
    <script src="/session.js"></script>
    <script>
      (function () {
        const form = document.getElementById('signup-form');
        const message = document.getElementById('message');
        handleForm(form, message, async function (data) {
          const body = await Sentinel.postJson('/v1/auth/signup', {
            firstName: data.get('firstName'),
            lastName: data.get('lastName'),
            email: data.get('email'),
            password: data.get('password'),
          });
          form.reset();
          showMessage(message, body.message, 'success');
        });
      })();
    </script>
  </body>
</html>
