<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose a new password · SENTINEL</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-aside" id="auth-aside" aria-hidden="true"></aside>
      <main class="auth-main">
        <div class="auth-card">
          <a class="brand" href="/"><span class="brand-mark"><i data-icon="shield"></i></span>SENTINEL</a>
          <div class="status-icon"><i data-icon="lock"></i></div>
          <h1>Choose a new password</h1>
          <p class="subtitle">To make sure it's you, we'll email a 6-digit code as well.</p>
          <form id="code-form" class="form" hidden>
            <button type="submit"><i data-icon="mail"></i>Email me a code</button>
          </form>
          <form id="reset-form" class="form" hidden>
            <label>Code
              <input name="code" inputmode="numeric" autocomplete="one-time-code" required pattern="\d{6}" maxlength="6" placeholder="123456" />
              <span class="hint">From the email we just sent. It expires in 10 minutes.</span>
            </label>
            <label>New password
              <input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128" placeholder="At least 12 characters" />
            </label>
            <label>Confirm new password
              <input name="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="128" />
            </label>
            <button type="submit">Change password</button>
            <button type="button" class="ghost" id="resend">Email me a new code</button>
          </form>
          <p id="message" class="message" role="status" aria-live="polite" hidden></p>
          <p class="links"><a href="/login.html" id="login-link">Back to log in</a></p>
        </div>
        <p class="auth-legal">Protected by SENTINEL · Tenant data is isolated with row-level security</p>
      </main>
    </div>
    <script src="/icons.js"></script>
    <script src="/auth.js"></script>
    <script src="/forms.js"></script>
    <script src="/session.js"></script>
    <script>
      (function () {
        const message = document.getElementById('message');
        const codeForm = document.getElementById('code-form');
        const resetForm = document.getElementById('reset-form');
        // Keep the token in memory and drop it from the address bar and history.
        const token = new URLSearchParams(window.location.hash.slice(1)).get('token');
        history.replaceState(null, '', window.location.pathname);

        if (!token) {
          showMessage(message, 'This page needs the link from your reset email. Ask for a new one from "Forgot your password?".', 'error');
          return;
        }
        codeForm.hidden = false;

        async function sendCode() {
          const body = await Sentinel.postJson('/v1/auth/password-reset/code', { token: token });
          showMessage(message, body.message, 'success');
        }

        handleForm(codeForm, message, async function () {
          await sendCode();
          codeForm.hidden = true;
          resetForm.hidden = false;
          resetForm.elements.code.focus();
        });

        document.getElementById('resend').addEventListener('click', function () {
          sendCode().catch(function (error) {
            showMessage(message, error.message, 'error');
          });
        });

        handleForm(resetForm, message, async function (data) {
          if (data.get('password') !== data.get('confirm')) throw new Error('The two passwords do not match.');
          const body = await Sentinel.postJson('/v1/auth/password-reset/complete', {
            token: token,
            code: data.get('code'),
            password: data.get('password'),
          });
          resetForm.hidden = true;
          showMessage(message, body.message, 'success');
          document.getElementById('login-link').textContent = 'Log in';
        });
      })();
    </script>
  </body>
</html>
